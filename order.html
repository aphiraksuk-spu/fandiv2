<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อ — Fan Di</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .order-wrap { max-width: 560px; margin-inline: auto; }
    .order-form { background: var(--color-white); border: 1px solid var(--color-line-soft); padding: var(--space-lg) var(--space-md); }
    .order-form .btn { width: 100%; margin-top: var(--space-sm); }
    .order-form .btn:disabled { opacity: .5; cursor: not-allowed; }
    .field textarea { resize: vertical; min-height: 5rem; }
    .field-hint { font-size: .8rem; color: var(--color-beige-dark); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Fan Di</a>
      <nav class="nav">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
        <a href="order.html" class="active">สั่งซื้อ</a>
      </nav>
    </div>
  </header>

  <div class="cork-band"></div>

  <main class="section">
    <div class="container">
      <div class="section-head text-center">
        <span class="eyebrow">Order</span>
        <h1 style="font-size: clamp(2rem, 5vw, 3.2rem);">สั่งซื้อสินค้า</h1>
        <span class="mood-underline" data-mood="fresh"></span>
        <p class="lead mt-md">กรอกข้อมูลด้านล่าง เราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>
      </div>

      <div class="order-wrap">
        <form id="orderForm" class="order-form" novalidate>
          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" required>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" inputmode="numeric" required>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" rows="3"></textarea>
            <span class="field-hint">เช่น ที่อยู่จัดส่ง หรือความต้องการเพิ่มเติม (ไม่บังคับ)</span>
          </div>

          <button type="submit" class="btn btn--solid">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="logo">Fan Di</span>
      <span>&copy; 2026 Fan Di. All rights reserved.</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
